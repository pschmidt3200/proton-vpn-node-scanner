[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proton-vpn-scanner"
version = "20.0.0"
description = "Ein asynchrones Analyse- und Diagnose-Werkzeug für ProtonVPN-Nodes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "pschmidt3200" }
]
keywords = ["protonvpn", "vpn", "network-scanner", "asyncio", "dns", "rich"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Networking",
]
dependencies = [
    "rich>=13.0.0",
    "dnspython>=2.3.0",
]

[project.optional-dependencies]
fast-ping = [
    "icmplib>=3.0.0",
]
dev = [
    "icmplib>=3.0.0",
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[project.scripts]
proton-scanner = "proton_scanner:main"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"proton_scanner.py" = ["E402"]
